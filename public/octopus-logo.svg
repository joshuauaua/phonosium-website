<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .octopus { fill: #FF6600; }
      .eye { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Head/Body -->
  <circle class="octopus" cx="100" cy="75" r="45"/>

  <!-- Eyes -->
  <circle class="eye" cx="85" cy="70" r="5"/>
  <circle class="eye" cx="115" cy="70" r="5"/>

  <!-- Smile -->
  <path fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" d="M 85 85 Q 100 95 115 85"/>

  <!-- Tentacles (8 total, curled) -->
  <!-- Left side tentacles -->
  <path class="octopus" d="M 70 110 Q 50 120 45 140 Q 40 155 45 160 Q 50 165 55 155 Q 60 140 65 125 Q 68 115 70 110 Z"/>
  <path class="octopus" d="M 60 115 Q 35 125 25 145 Q 18 162 23 168 Q 28 174 35 165 Q 45 150 52 130 Q 56 120 60 115 Z"/>
  <path class="octopus" d="M 50 118 Q 25 135 15 155 Q 8 172 13 178 Q 18 184 25 175 Q 38 160 45 140 Q 48 125 50 118 Z"/>
  <path class="octopus" d="M 80 112 Q 65 118 58 135 Q 52 150 57 156 Q 62 162 68 152 Q 75 135 78 120 Q 80 115 80 112 Z"/>

  <!-- Right side tentacles -->
  <path class="octopus" d="M 130 110 Q 150 120 155 140 Q 160 155 155 160 Q 150 165 145 155 Q 140 140 135 125 Q 132 115 130 110 Z"/>
  <path class="octopus" d="M 140 115 Q 165 125 175 145 Q 182 162 177 168 Q 172 174 165 165 Q 155 150 148 130 Q 144 120 140 115 Z"/>
  <path class="octopus" d="M 150 118 Q 175 135 185 155 Q 192 172 187 178 Q 182 184 175 175 Q 162 160 155 140 Q 152 125 150 118 Z"/>
  <path class="octopus" d="M 120 112 Q 135 118 142 135 Q 148 150 143 156 Q 138 162 132 152 Q 125 135 122 120 Q 120 115 120 112 Z"/>
</svg>
