<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <style>
      .octopus-body { fill: #FF9800; }
      .octopus-detail { fill: #F57C00; }
    </style>
  </defs>

  <!-- Head/Body -->
  <circle class="octopus-body" cx="24" cy="20" r="10"/>

  <!-- Eyes -->
  <circle fill="#fff" cx="20" cy="18" r="2.5"/>
  <circle fill="#fff" cx="28" cy="18" r="2.5"/>
  <circle fill="#000" cx="20" cy="18" r="1.2"/>
  <circle fill="#000" cx="28" cy="18" r="1.2"/>

  <!-- Tentacles (8 total) -->
  <!-- Front left -->
  <path class="octopus-detail" d="M 16 26 Q 12 30 12 36 Q 12 38 13 38 Q 14 38 14 36 Q 14 32 16 28 Z"/>
  <!-- Mid left -->
  <path class="octopus-body" d="M 18 28 Q 14 32 10 38 Q 9 40 10 41 Q 11 42 12 40 Q 16 34 18 30 Z"/>
  <!-- Back left -->
  <path class="octopus-detail" d="M 20 28 Q 16 34 12 42 Q 11 44 12 45 Q 13 46 14 44 Q 18 36 20 30 Z"/>
  <!-- Far left -->
  <path class="octopus-body" d="M 22 28 Q 18 36 14 44 Q 13 46 14 47 Q 15 48 16 46 Q 20 38 22 30 Z"/>

  <!-- Front right -->
  <path class="octopus-detail" d="M 32 26 Q 36 30 36 36 Q 36 38 35 38 Q 34 38 34 36 Q 34 32 32 28 Z"/>
  <!-- Mid right -->
  <path class="octopus-body" d="M 30 28 Q 34 32 38 38 Q 39 40 38 41 Q 37 42 36 40 Q 32 34 30 30 Z"/>
  <!-- Back right -->
  <path class="octopus-detail" d="M 28 28 Q 32 34 36 42 Q 37 44 36 45 Q 35 46 34 44 Q 30 36 28 30 Z"/>
  <!-- Far right -->
  <path class="octopus-body" d="M 26 28 Q 30 36 34 44 Q 35 46 34 47 Q 33 48 32 46 Q 28 38 26 30 Z"/>

  <!-- Smile -->
  <path fill="none" stroke="#F57C00" stroke-width="1" stroke-linecap="round" d="M 20 22 Q 24 24 28 22"/>
</svg>
