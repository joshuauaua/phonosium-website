name: Deploy Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: phonosium-api
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './api'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          npm ci --production

      - name: Wait for Function App to be ready
        run: |
          echo "Checking if Function App is available..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net || echo "000")
            echo "Attempt $((attempt + 1))/$max_attempts - Response: $response"
            if [ "$response" != "503" ] && [ "$response" != "000" ]; then
              echo "Function App is responding!"
              break
            fi
            if [ $attempt -eq $((max_attempts - 1)) ]; then
              echo "Warning: Function App still not fully available, but proceeding with deployment..."
            fi
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          respect-funcignore: true

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to settle..."
          sleep 30
          echo "Testing endpoints..."
          curl -X OPTIONS https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/submissions/upload-url \
            -H "Origin: https://phonosium-website.vercel.app" \
            -I || echo "Endpoint test failed, but deployment may still succeed"
